name: Web PR Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-preview.yaml'

jobs:
  build-and-test:
    name: Build & Test (Sandbox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run Checks (Format & Lint)
        run: pnpm check
        working-directory: web

      - name: Run Tests
        run: pnpm test
        working-directory: web

      - name: Build Web Application
        run: pnpm build
        working-directory: web

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  deploy-preview:
    name: Deploy Preview (Needs Approval)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy_worker.outputs.deployment-url }}
    permissions:
      pull-requests: write # Required to comment on the PR
    steps:
      # Securely checkout only the base repository (main) to avoid running untrusted scripts
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # Deploy using wrangler using the pre-compiled config but dynamically specifying the environment
      - name: Deploy to Cloudflare Workers
        id: deploy_worker
        run: |
          # Deploy the pre-built application using the preview environment config
          OUTPUT=$(pnpm dlx wrangler deploy --config dist/server/wrangler.json --env preview)
          echo "$OUTPUT"
          
          # Extract deployment URL
          URL=$(echo "$OUTPUT" | grep -oE "https://[a-zA-Z0-9.-]+\.workers\.dev" | head -n 1)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: web

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ### 🚀 PR Preview Deployed Successfully!
            
            - **Preview URL**: [${{ steps.deploy_worker.outputs.deployment-url }}](${{ steps.deploy_worker.outputs.deployment-url }})
            
            _This preview deployment was reviewed and approved._
