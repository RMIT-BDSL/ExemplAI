name: Deploy Preview

on:
  pull_request:
    branches:
      - main
      - dev
      - develop # Runs whenever a pull request is opened or updated against these branches

permissions:
  contents: read
  pull-requests: write # Required so the bot can post a comment on the PR

jobs:
  deploy:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

#      - name: Lint and Format Check
#        run: pnpm check
#        working-directory: web

#      - name: Run Tests
#        run: pnpm test
#        working-directory: web

      - name: Deploy Convex Backend (Preview)
        run: npx convex deploy
        working-directory: web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }} # Automatically deploys to a preview environment named after the branch if configured on Convex

      - name: Build Web Frontend (Preview)
        run: pnpm build
        working-directory: web
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🚀 Preview Deployment Successful!
            
            Preview environment deployment has been built and verified:
            - **Convex Backend**: Deployed as preview environment for branch `${{ github.head_ref }}`.
            - **Checks**: Code compilation, lint/format check, and tests passed.
