name: Deploy Development

on:
  push:
    branches:
      - dev
      - develop
    paths:
      - 'web/**'
      - '.github/workflows/deploy-dev.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Development
    runs-on: ubuntu-latest
    environment:
      name: development

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex Backend (Dev)
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}

      - name: Build Web Frontend (Dev)
        run: pnpm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL_DEV }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL_DEV }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL_DEV }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_DEV }}
