name: Update Changelog

on:
  push:
    branches:
      - main # Triggers when code is merged into main

jobs:
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the updated CHANGELOG.md back to the repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches all history so git-cliff can read past commits

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1. Use git-cliff to calculate the next version number based on semantic commits
      - name: Determine Next Version
        id: next_version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bump

      # 2. Update CHANGELOG.md in the repository with the complete history including the new version
      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bump --output CHANGELOG.md

      # 3. Commit and Push CHANGELOG.md
      - name: Commit and Push CHANGELOG.md
        run: |
          git add CHANGELOG.md
          git commit -m "chore(release): bump version to ${{ steps.next_version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin main
